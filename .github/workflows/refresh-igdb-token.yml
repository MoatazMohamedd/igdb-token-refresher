name: Refresh IGDB access token

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: "Comma-separated OWNER/REPOSITORY targets (leave blank to use the IGDB_REPOSITORIES variable)"
        required: false
        type: string
      dry_run:
        description: "Request a token without changing repository secrets"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # The workflow's built-in GITHUB_TOKEN cannot update secrets in other repos.
      GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      IGDB_REPOSITORIES: ${{ inputs.repositories || vars.IGDB_REPOSITORIES }}
    steps:
      - name: Check out refresher
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh token and update repository secrets
        run: python refresh_igdb_token.py ${{ inputs.dry_run && '--dry-run' || '' }}
